[build-system]
requires = ["hatchling>=1.33,<2"]
build-backend = "hatchling.build"

[project]
name = "kronbot"
version = "0.2.1"
description = "Автозапись на физкультуру ИТМО из терминала"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12.4"
dependencies = [
    "httpx>=0.29,<0.30",
    "packaging>=24,<27",
    "portalocker>=4.4,<5",
    "textual>=8.2,<9",
    "playwright>=1.65,<2",
    "pywin32>=312,<313; sys_platform == 'win32'",
]

[project.scripts]
kronbot = "kronbot.__main__:main"

[dependency-groups]
dev = ["pytest>=9,<10", "pytest-asyncio>=1.5,<2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["browser: real Chromium tests"]
