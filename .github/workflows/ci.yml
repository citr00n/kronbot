name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          python-version: '3.12.4'
          enable-cache: false
      - name: Test Python CLI and TUI
        run: uv run --locked pytest -q -m 'not browser'
      - name: Install Chromium and Linux dependencies
        run: uv run --locked playwright install --with-deps chromium
      - name: Test headless Chromium
        run: uv run --locked pytest -q tests/test_browser.py
