name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          python-version: '3.12'
          enable-cache: false
      - run: uv run --locked pytest -q tests/test_cli.py
      - run: uv run --locked --extra tui pytest -q -m "not browser"
      - if: runner.os == 'Linux'
        run: uv run --locked --extra browser playwright install --with-deps chromium
      - if: runner.os != 'Linux'
        run: uv run --locked --extra browser playwright install chromium
      - run: uv run --locked --extra browser pytest -q tests/test_browser.py
